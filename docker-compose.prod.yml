# Production stack: images are built from source, nothing is bind-mounted, the
# database migrations run once before the API and workers start, and only the
# API and the web app publish ports.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Host ports can be changed through .env (BACKEND_PORT / FRONTEND_PORT).

name: ai-knowledge-agent

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: prod

x-backend-env: &backend-env
  - path: .env
    required: false

services:
  # One-shot service: applies Alembic migrations, then exits successfully.
  migrate:
    build: *backend-build
    env_file: *backend-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    env_file: *backend-env
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_upload_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: *backend-build
    env_file: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    volumes:
      - backend_upload_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build: *backend-build
    env_file: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      # Baked into the browser bundle at build time, so it has to point at the
      # address the user's browser can reach.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_agent}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  minio_data:
  backend_upload_data:
