[project]
name = "knowledge-agent-backend"
version = "0.1.0"
description = "Backend scaffold for AI Knowledge Structuring Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "pytesseract>=0.3.13,<1.0",
  "Pillow>=11,<12",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.4,<6.0",
  "chromadb>=0.5,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.3,<1.0",
  "boto3>=1.35,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
